<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140" width="650" height="140" fill="none">
    <defs>
        <!-- Shadow -->
        <filter id="emblemShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
        </filter>

        <!-- Arched Text Paths for Emblem -->
        <path id="topTextArc" d="M 22,55 A 48,48 0 0,1 108,55" fill="none"/>
        <path id="bottomTextArc" d="M 25,82 A 50,50 0 0,0 105,82" fill="none"/>
    </defs>

    <!-- ================= 1. LEFT LOGO EMBLEM ================= -->
    <g id="logo-emblem" transform="translate(10, 6) scale(0.95)" filter="url(#emblemShadow)">
        <!-- Outer Pentagon -->
        <polygon points="65,3 124,42 101,123 29,123 6,42" fill="#0f172a"/>
        <polygon points="65,5 121,43 99,121 31,121 9,43" fill="#ffffff"/>
        <polygon points="65,7 119,44 97,119 33,119 11,44" fill="#29abe2" stroke="#000000" stroke-width="1.5"/>

        <!-- Top Arched Text -->
        <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="8.5" fill="#000000" letter-spacing="1">
            <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
                SMK NEGERI 2
            </textPath>
        </text>

        <!-- Stars -->
        <polygon points="24,50 25,53 28,53 26,55 27,58 24,56 21,58 22,55 20,53 23,53" fill="#000000"/>
        <polygon points="106,50 107,53 110,53 108,55 109,58 106,56 103,58 104,55 102,53 105,53" fill="#000000"/>

        <!-- Yellow Gear -->
        <g fill="#ffeb3b" stroke="#000000" stroke-width="1.2" stroke-linejoin="round">
            <path d="M 60,34 L 70,34 L 71,40 L 79,41 L 84,37 L 92,44 L 89,50 L 95,55 L 102,54 L 105,63 L 99,68 L 101,75 L 107,79 L 102,88 L 95,87 L 91,93 L 93,99 L 84,103 L 80,99 L 73,102 L 71,108 L 61,108 L 60,102 L 52,100 L 48,104 L 39,99 L 42,92 L 36,87 L 29,88 L 26,79 L 32,74 L 30,67 L 24,64 L 27,55 L 34,55 L 38,49 L 36,42 L 45,37 L 50,41 L 57,39 Z"/>
        </g>

        <!-- Green Petals -->
        <g fill="#66bb6a" stroke="#000000" stroke-width="1" stroke-linejoin="round">
            <polygon points="65,39 70,59 89,48 77,64 97,72 77,80 89,96 70,85 65,105 60,85 41,96 53,80 33,72 53,64 41,48 60,59"/>
        </g>

        <!-- Earth Globe -->
        <circle cx="65" cy="72" r="19" fill="#1565c0" stroke="#000000" stroke-width="1.5"/>
        <!-- Map Contours -->
        <g fill="#ffffff" opacity="0.95">
            <path d="M 51,67 Q 56,64 61,68 Q 57,71 52,70 Z"/>
            <path d="M 56,73 Q 62,71 67,73 Q 63,75 57,74 Z"/>
            <path d="M 64,68 Q 69,65 71,68 Q 68,71 64,70 Z"/>
            <path d="M 72,71 Q 77,69 80,73 Q 76,75 72,73 Z"/>
        </g>

        <!-- Bar Chart -->
        <rect x="46" y="88" width="38" height="3.5" fill="#4a148c" stroke="#000000" stroke-width="0.8" rx="0.5"/>
        <line x1="44" y1="92" x2="86" y2="92" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
        <rect x="50" y="78" width="4" height="10" fill="#4caf50" stroke="#000000" stroke-width="0.6"/>
        <rect x="55" y="72" width="4" height="16" fill="#e0f2fe" stroke="#000000" stroke-width="0.6"/>
        <rect x="61" y="67" width="4" height="21" fill="#e53935" stroke="#000000" stroke-width="0.6"/>
        <rect x="67" y="70" width="4" height="18" fill="#fb8c00" stroke="#000000" stroke-width="0.6"/>
        <rect x="72" y="76" width="4" height="12" fill="#43a047" stroke="#000000" stroke-width="0.6"/>

        <!-- Trend Arrows -->
        <path d="M 48,84 L 60,71 L 59,70 L 63,69 L 62,73 L 61,72" fill="#6a1b9a" stroke="#4a148c" stroke-width="1"/>
        <path d="M 82,84 L 70,71 L 71,70 L 67,69 L 68,73 L 69,72" fill="#6a1b9a" stroke="#4a148c" stroke-width="1"/>

        <!-- 4-Petal Loop Knot -->
        <g stroke-linecap="round" fill="none">
            <path d="M 65,56 C 57,45 49,50 56,58 C 61,63 65,56 65,56 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
            <path d="M 65,56 C 73,45 81,50 74,58 C 69,63 65,56 65,56 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
            <path d="M 65,56 C 57,67 49,62 56,54 C 61,49 65,56 65,56 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
            <path d="M 65,56 C 73,67 81,62 74,54 C 69,49 65,56 65,56 Z" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
            <circle cx="65" cy="56" r="1.5" fill="#ffffff" stroke="#000000" stroke-width="0.6"/>
        </g>

        <!-- Bottom Arched Text -->
        <text font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="8" fill="#000000" letter-spacing="1">
            <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
                KOTA MOJOKERTO
            </textPath>
        </text>
    </g>

    <!-- ================= 2. RIGHT SCHOOL NAME TEXT ================= -->
    <g id="brand-text" fill="#ffffff">
        <!-- Line 1: SMK NEGERI 2 -->
        <text x="150" y="62" font-family="'Arial Black', 'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="44" letter-spacing="2" fill="#ffffff">
            SMK NEGERI 2
        </text>

        <!-- Line 2: KOTA MOJOKERTO -->
        <text x="150" y="112" font-family="'Arial Black', 'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="42" letter-spacing="2.5" fill="#ffffff">
            KOTA MOJOKERTO
        </text>
    </g>
</svg>
